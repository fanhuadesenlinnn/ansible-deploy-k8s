---
# 本文件会应用到 Inventory 中的所有主机，是项目最主要的配置入口。
# 建议先复制 ansible/inventories/example，再按实际环境修改；不要提交密码、Token 或真实生产地址。

# -----------------------------------------------------------------------------
# 集群标识与 Kubernetes 软件包
# -----------------------------------------------------------------------------
# 集群名称会写入 kubeadm 配置，也用于生成 ansible/artifacts/<cluster_name>.conf。
# reset.yml 还会要求再次输入该值，防止误重置错误的集群。
cluster_name: demo

# Kubernetes 的完整版本号，不带前缀 v。现有节点上的 kubelet 必须与此值完全一致。
# 直接修改该值不会执行集群升级；已有集群升级必须单独遵循 kubeadm 升级流程。
kubernetes_version: "1.36.3"

# 软件源使用的主版本号和次版本号，例如 v1.36。通常保持自动计算，不需要手工填写。
kubernetes_version_minor: >-
  v{{ kubernetes_version.split('.')[0] }}.{{ kubernetes_version.split('.')[1] }}

# Debian 软件包版本。pkgs.k8s.io 的包版本通常在 Kubernetes 版本后带 -1.1。
kubernetes_package_version: "{{ kubernetes_version }}-1.1"

# Kubernetes apt 软件源和签名密钥。使用内部镜像时，可以同时替换下面两个地址。
kubernetes_apt_repository: >-
  deb [signed-by=/etc/apt/keyrings/kubernetes.asc]
  https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version_minor }}/deb/ /
kubernetes_apt_key_url: >-
  https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version_minor }}/deb/Release.key

# kubeadm 拉取控制平面镜像时使用的仓库。离线安装时，镜像仍需预先导入目标运行时。
kubernetes_image_repository: registry.k8s.io

# -----------------------------------------------------------------------------
# 容器运行时
# -----------------------------------------------------------------------------
# 可选值：containerd 或 crio。containerd 是默认和最常见的选择。
# 已加入集群的节点不能通过修改此变量直接切换运行时，预检会主动阻止这种隐式迁移。
container_runtime: containerd

# 服务名和 CRI Socket 根据 container_runtime 自动派生，除非使用自定义服务名或 Socket，否则不要修改。
container_runtime_service: "{{ 'containerd' if container_runtime == 'containerd' else 'crio' }}"
# containerd 对应的 Debian 软件包名；发行版使用不同包名时可以覆盖。
containerd_package: containerd
kubernetes_cri_socket: >-
  {{ 'unix:///run/containerd/containerd.sock'
     if container_runtime == 'containerd'
     else 'unix:///var/run/crio/crio.sock' }}

# CRI-O 与 Kubernetes 保持相同的主版本号和次版本号。仅选择 crio 时使用这些变量。
crio_version_minor: "{{ kubernetes_version_minor }}"
crio_apt_repository: >-
  deb [signed-by=/etc/apt/keyrings/cri-o.asc]
  https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{{ crio_version_minor }}/deb/ /
crio_apt_key_url: >-
  https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{{ crio_version_minor }}/deb/Release.key

# -----------------------------------------------------------------------------
# crictl 节点排查工具
# -----------------------------------------------------------------------------
# true 表示在每个 Kubernetes 节点安装 crictl；false 表示完全跳过该 Role。
install_crictl: true

# 建议与 Kubernetes 保持相同的主版本号和次版本号，例如 Kubernetes 1.36.x 对应 crictl v1.36.x。
crictl_version: v1.36.0

# 二进制和配置文件的目标位置。默认值符合常见 Linux 运维习惯，通常无需修改。
crictl_install_dir: /usr/local/bin
crictl_install_path: "{{ crictl_install_dir }}/crictl"
crictl_config_dir: /etc
crictl_config_path: "{{ crictl_config_dir }}/crictl.yaml"

# crictl 请求 CRI 的超时时间（秒）和调试输出。
# pull_image_on_create=false 表示创建容器时不额外强制拉取镜像。
crictl_timeout: 10
crictl_debug: false
crictl_pull_image_on_create: false

# 在线模式的下载地址会根据版本和 CPU 架构自动生成。
crictl_download_url: >-
  {{ 'https://github.com/kubernetes-sigs/cri-tools/releases/download/'
     ~ crictl_version ~ '/crictl-' ~ crictl_version ~ '-linux-'
     ~ crictl_arch ~ '.tar.gz' }}

# 下载归档的 SHA-256 校验和。修改 crictl_version 后必须同步更新两种架构的值。
crictl_checksums:
  amd64: sha256:83855e114566a8a8c44c548d515670f51de3a5e1da8b2effb59870e2f10c25a3
  arm64: sha256:68328594ccf780a80ae2b092d9f6ce484eec7cf540c275242e8fd954bfd95332
# crictl_arch 由 Role 根据目标主机架构生成，此处自动选择对应校验和。
crictl_checksum: "{{ crictl_checksums[crictl_arch] }}"

# -----------------------------------------------------------------------------
# Kubernetes 网络
# -----------------------------------------------------------------------------
# Pod 和 Service 使用的虚拟网段不能重叠，也不应与节点网络、VPN 或现有数据中心网段冲突。
# 集群初始化后不要直接修改这两个值；变更网段需要专门的网络迁移方案。
pod_network_cidr: 10.244.0.0/16
service_cidr: 10.96.0.0/16

# 集群内部 DNS 后缀，默认值也是 Kubernetes 的常见默认值。
cluster_dns_domain: cluster.local

# 留空表示“第一台控制平面节点的地址:6443”。使用多个控制平面节点时，
# 请设置为稳定的负载均衡器或 VIP 端点，例如 k8s.example:6443。
control_plane_endpoint: ""

# kube-apiserver 在控制平面节点上监听的端口。
api_server_bind_port: 6443

# 额外写入 API Server 证书的 DNS 名称或 IP。通过其他域名、VIP 访问 API 时应在此添加。
# 示例：api_server_cert_sans: ["k8s.example.com", "192.0.2.100"]
api_server_cert_sans: []

# -----------------------------------------------------------------------------
# CNI 集群网络插件
# -----------------------------------------------------------------------------
# CNI 独立于 kubeadm 安装。cni_plugin=flannel 时，Role 会将 Flannel 清单中的默认 Pod CIDR
# 替换为 pod_network_cidr。使用 Calico、Cilium 等其他插件时，请同时修改名称和清单来源。
cni_plugin: flannel

# 在线模式下二选一：设置 cni_manifest_file 使用 Ansible 控制端的本地文件；留空则下载 URL。
# 从 URL 下载时必须提供 SHA-256 校验和，防止上游内容被替换或下载损坏。
cni_manifest_url: >-
  https://github.com/flannel-io/flannel/releases/download/v0.28.8/kube-flannel.yml
cni_manifest_checksum: sha256:4148e659a834b51fc9aadc429281c6e80c97e0e25475faacd4cc857dbd16f21b
cni_manifest_file: ""

# 离线模式下，从 <offline_remote_dir>/manifests/ 读取的 CNI 文件名。
offline_cni_manifest: kube-flannel.yml

# -----------------------------------------------------------------------------
# 在线或离线安装
# -----------------------------------------------------------------------------
# online 使用软件源和下载 URL；offline 只使用准备好的离线包，不主动下载依赖。
install_mode: online  # online（在线）或 offline（离线）

# 离线模式下，offline_bundle_path 与 offline_bundle_url 必须且只能设置一个：
# - path：Ansible 控制端上的目录，由 Ansible 复制到每台目标主机；
# - url：所有目标主机都能访问的 tar.gz 地址，必须同时设置 checksum。
offline_bundle_path: ""
offline_bundle_url: ""
offline_bundle_checksum: ""

# 离线内容在目标主机上的工作目录。软件包、镜像和清单都会从这里读取。
offline_remote_dir: /opt/ansible-install-k8s/offline

# -----------------------------------------------------------------------------
# 代理与镜像仓库
# -----------------------------------------------------------------------------
# 可选的 HTTP 代理环境变量，会传递给 apt、下载任务、kubeadm 和容器运行时 systemd 服务。
# 示例：proxy_env: { HTTP_PROXY: "http://proxy.example:3128", NO_PROXY: "127.0.0.1,10.0.0.0/8" }
proxy_env: {}

# 可选的 containerd 镜像仓库端点，仅在 container_runtime=containerd 时生效。
# 每个键是原始镜像仓库域名，endpoint 是实际访问的镜像或代理地址。
# skip_verify=true 会跳过 TLS 证书校验，只应在受控测试环境中使用。
# registry_mirrors:
#   registry.example.com:
#     endpoint: https://registry.example.com
#     skip_verify: false
registry_mirrors: {}

# -----------------------------------------------------------------------------
# kubelet 与 kubeadm 自定义参数
# -----------------------------------------------------------------------------
# 单节点允许创建的最大 Pod 数量，同时写入 kubeadm 和 KubeletConfiguration。
kubelet_max_pods: 110

# 追加到 kubeadm init 命令末尾的参数列表。只有明确了解 kubeadm 参数时才应使用。
# 示例：临时提高日志详细程度可设置 kubeadm_extra_args: ["--v=5"]。
kubeadm_extra_args: []

# true 表示关闭节点 Swap，并让 kubelet 在检测到 Swap 时拒绝启动，适合普通生产服务器。
# 某些受控测试环境（例如无法关闭宿主 Swap 的 OrbStack Machine）可以设为 false；此时系统进程仍可使用
# Swap，但下面生成的 KubeletConfiguration 保持 NoSwap，不允许 Pod 工作负载使用 Swap。
kubelet_fail_swap_on: true

# 指定 kubelet 注册的节点 IP。多网卡主机建议显式设置；留空时由 kubelet 自动选择。
kubelet_node_ip: ""

# Server-Side Apply 发生字段所有权冲突时是否添加 --force-conflicts。
# 默认 false 更安全；设为 true 可能覆盖其他控制器或人工管理的字段。
kubernetes_apply_force_conflicts: false

# -----------------------------------------------------------------------------
# 管理员 kubeconfig 导出
# -----------------------------------------------------------------------------
# 输出目录位于 Ansible 控制端而不是目标节点，并设置为仅当前用户可访问。
kubeconfig_output_dir: "{{ playbook_dir }}/../artifacts"
kubeconfig_output_file: "{{ kubeconfig_output_dir }}/{{ cluster_name }}.conf"

# 非空时替换导出文件中的 API Server 地址，例如改为负载均衡器的外部地址。
# 这里只修改导出的副本，不会更改集群内部的 admin.conf。
kubeconfig_server: ""

# -----------------------------------------------------------------------------
# 可选 Kubernetes 附加组件
# -----------------------------------------------------------------------------
# 将组件设为 true 后，运行 playbooks/addons.yml 才会安装或更新；site.yml 不会自动调用它。
addons:
  metrics_server: false
  cert_manager: false
  reloader: false
  istio: false

# 在线模式下使用的清单 URL，可以替换为企业内部镜像。启用 istio 前必须自行配置 URL。
addon_manifests:
  metrics_server: https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
  cert_manager: https://github.com/cert-manager/cert-manager/releases/download/v1.21.1/cert-manager.yaml
  reloader: >-
    https://raw.githubusercontent.com/stakater/Reloader/chart-v2.2.12/deployments/kubernetes/reloader.yaml
  istio: ""

# 每个在线清单的 SHA-256 校验和。URL 或版本变更时必须同步更新。
# 离线模式不使用这些 URL，而是读取 <offline_remote_dir>/manifests/<组件名>.yaml。
addon_manifest_checksums:
  metrics_server: sha256:1cec29a5267809306a2c6ec74a3e449abbb705b4a8beed0c8a1963910f72c79b
  cert_manager: sha256:5f6a499b8c1857d57f560f536e0dcc830914b45c420899fe7ad0692c8624e408
  reloader: sha256:d3f8faee2f4a9275a7958d76205115a111b441c47f6cc31abd749fc4c31e6a53
  istio: ""

# -----------------------------------------------------------------------------
# 可选 dufs 离线制品服务器
# -----------------------------------------------------------------------------
# 这些变量只由 playbooks/artifact-server.yml 使用，site.yml 不依赖 dufs。
# dufs 会以只读方式共享 dufs_root，默认监听所有网卡的 dufs_port。
dufs_version: v0.46.0
dufs_port: 666
dufs_root: "{{ offline_remote_dir }}"

# 在线模式下载 dufs 静态二进制的地址和分架构校验和。
dufs_download_url: >-
  {{ 'https://github.com/sigoden/dufs/releases/download/' ~ dufs_version
     ~ '/dufs-' ~ dufs_version ~ '-' ~ dufs_arch ~ '-unknown-linux-musl.tar.gz' }}
dufs_checksums:
  x86_64: sha256:817769f726613194bcff9d0e3e481eaccc86ac11208857614f36a8c02f410977
  aarch64: sha256:1472123ae3aa07e49404d16b20305c2dec90c59883ebda9308717f7205e6511b
# dufs_arch 由 Role 根据目标主机架构生成，此处自动选择对应校验和。
dufs_checksum: "{{ dufs_checksums[dufs_arch] }}"

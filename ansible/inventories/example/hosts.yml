---
# 这是示例 Inventory。实际使用时建议复制整个 example 目录，而不是直接修改本文件：
# cp -R ansible/inventories/example ansible/inventories/<你的集群名>
#
# ansible_host 是 Ansible 控制端用于 SSH 连接的地址，可以是内网 IP 或可解析的主机名。
# control-01、worker-01 等是 Ansible 的 inventory_hostname，也会用于识别每台主机。
all:
  children:
    # 控制平面节点组。列表中的第一台主机负责执行 kubeadm init；其余节点依次加入控制平面。
    # 多控制平面部署还必须在 group_vars/all.yml 中配置稳定的 control_plane_endpoint。
    kube_control_plane:
      hosts:
        control-01:
          ansible_host: 192.0.2.10

    # 工作节点组。控制平面初始化和 CNI 安装完成后，这些节点会通过 kubeadm join 加入集群。
    kube_workers:
      hosts:
        worker-01:
          ansible_host: 192.0.2.11
        worker-02:
          ansible_host: 192.0.2.12

    # 全集群主机组。预检、系统准备、容器运行时和 Kubernetes 软件包会在此组的所有主机上执行。
    # kube_control_plane 与 kube_workers 必须都是它的子组，否则 site.yml 的 Inventory 校验会失败。
    k8s_cluster:
      vars:
        # 目标主机的 SSH 用户。该用户需要能够登录，并在 ansible_become=true 时执行 sudo。
        ansible_user: ubuntu
        # 使用 sudo 获取 root 权限。若 sudo 需要密码，请使用 --ask-become-pass 或安全的变量管理方式。
        ansible_become: true
      children:
        kube_control_plane: {}
        kube_workers: {}

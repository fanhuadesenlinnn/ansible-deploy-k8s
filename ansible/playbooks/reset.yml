---
# 危险：此 Playbook 会从 Inventory 选中的所有 Kubernetes 主机删除集群状态。
# 它与 site.yml 完全分离，并要求同时提供布尔确认和准确的 cluster_name，降低误操作风险。
# kubeadm reset 不清理 iptables、nftables 或 IPVS 规则，如需还原裸机状态还要手工处理这些规则。
- name: 重置 Kubernetes 主机
  hosts: k8s_cluster
  become: true
  gather_facts: false
  vars:
    kubernetes_reset_confirm: false
    kubernetes_reset_cluster_name: ""
  tasks:
    - name: 要求明确确认破坏性操作
      ansible.builtin.assert:
        that:
          - kubernetes_reset_confirm | bool
          - kubernetes_reset_cluster_name == cluster_name
        fail_msg: >-
          重置操作具有破坏性。确认所选 Inventory 和主机无误后，请使用
          -e kubernetes_reset_confirm=true 和
          -e kubernetes_reset_cluster_name={{ cluster_name }}.
        success_msg: 已确认重置目标和破坏性操作。

    # kubeadm reset 使用与安装时相同的 CRI Socket，确保能正确停止并清理容器运行时中的 Pod。
    - name: 重置 kubeadm 状态
      ansible.builtin.command:
        argv:
          - kubeadm
          - reset
          - --force
          - --cri-socket
          - "{{ kubernetes_cri_socket }}"
      register: kubeadm_reset_result
      changed_when: kubeadm_reset_result.rc == 0

    # kubeadm 不会完整删除 CNI 状态，因此显式移除网络配置和 kubelet 证书目录。
    - name: 删除 CNI 配置
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/cni/net.d
        - /var/lib/cni
        - /var/lib/kubelet/pki

    - name: 删除 Kubernetes 配置
      ansible.builtin.file:
        path: /etc/kubernetes
        state: absent

    - name: 删除本项目创建的 root kubeconfig
      ansible.builtin.file:
        path: /root/.kube/config
        state: absent

    - name: 重启容器运行时
      ansible.builtin.service:
        name: "{{ container_runtime_service }}"
        state: restarted

    # 此任务通过 delegate_to 在 Ansible 控制端执行，而不是在目标 Kubernetes 节点执行。
    - name: 删除已导出的管理员 kubeconfig
      ansible.builtin.file:
        path: "{{ kubeconfig_output_file }}"
        state: absent
      delegate_to: localhost
      become: false
      run_once: true

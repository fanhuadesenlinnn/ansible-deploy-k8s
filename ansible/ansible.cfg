# 在 ansible/ 目录运行命令时会自动读取本文件；ops.sh 和 Docker 环境也会明确使用它。
[defaults]
# 未通过 -i 指定 Inventory 时使用示例清单；生产操作建议始终显式传入自己的 -i 路径。
inventory = inventories/example/hosts.yml
# 允许 Playbook 直接通过短名称引用仓库内的 roles/<名称>。
roles_path = roles
# 首次连接未知主机时要求校验 SSH Host Key，防止误连或中间人攻击。
host_key_checking = True
# 自动发现目标主机上的 Python，并隐藏自动发现产生的普通提示。
interpreter_python = auto_silent
# 新版 Ansible 已不依赖 .retry 文件，关闭后也可避免在仓库中留下临时主机列表。
retry_files_enabled = False
stdout_callback = default
# 单次 SSH 连接的默认超时时间，单位为秒。
timeout = 30

[ssh_connection]
# 通过已有 SSH 连接执行 sudo，减少每个任务重新建立连接的开销。
pipelining = True
# 复用 SSH 控制连接 60 秒，批量部署多任务时能明显减少握手次数。
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

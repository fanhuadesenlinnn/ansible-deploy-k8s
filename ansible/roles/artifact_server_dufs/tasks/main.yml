---
# dufs Role：在第一台控制平面节点提供只读 HTTP 文件服务，便于其他节点下载离线归档。
# 在线模式下载固定版本静态二进制，离线模式要求 offline_remote_dir/bin/dufs 已存在。
# 服务监听地址、端口和共享目录由 defaults/main.yml 或 Inventory 覆盖。

- name: 将主机架构映射为 dufs 发布架构
  ansible.builtin.set_fact:
    dufs_arch: "{{ {'x86_64': 'x86_64', 'aarch64': 'aarch64'}[ansible_architecture] }}"

# DynamicUser 不应获取绑定特权端口的 Capability，因此只允许普通用户可监听的端口。
- name: 验证 dufs 监听端口
  ansible.builtin.assert:
    that:
      - dufs_port | int >= 1024
      - dufs_port | int <= 65535
    fail_msg: dufs_port 必须是 1024 到 65535 之间的非特权端口。
    success_msg: dufs 监听端口有效。

- name: 要求为在线下载的 dufs 配置校验和
  ansible.builtin.assert:
    that:
      - dufs_checksum | length > 0
    fail_msg: 请将 dufs_checksum 设置为 dufs_download_url 对应的 SHA-256 摘要。
    success_msg: dufs 下载校验和已配置。
  when: install_mode == 'online'

- name: 确保制品根目录存在
  ansible.builtin.file:
    path: "{{ dufs_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: 在在线模式下下载 dufs 归档
  ansible.builtin.get_url:
    url: "{{ dufs_download_url }}"
    dest: "/tmp/dufs-{{ dufs_version }}.tar.gz"
    checksum: "{{ dufs_checksum | default(omit, true) }}"
    owner: root
    group: root
    mode: "0644"
  environment: "{{ proxy_env }}"
  when: install_mode == 'online'

- name: 在在线模式下解压 dufs
  ansible.builtin.unarchive:
    src: "/tmp/dufs-{{ dufs_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include:
      - dufs
    owner: root
    group: root
    mode: "0755"
  when: install_mode == 'online'

- name: 从离线包安装 dufs
  ansible.builtin.copy:
    src: >-
      {{ dufs_offline_binary_path
         if dufs_offline_binary_path | length > 0
         else offline_remote_dir ~ '/bin/dufs' }}
    dest: /usr/local/bin/dufs
    remote_src: "{{ dufs_offline_binary_path | length == 0 }}"
    owner: root
    group: root
    mode: "0755"
  when: install_mode == 'offline'

- name: 将离线归档投放到 dufs 共享目录
  ansible.builtin.copy:
    src: "{{ dufs_bundle_archive_path }}"
    dest: "{{ dufs_root }}/{{ dufs_bundle_archive_name }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - install_mode == 'offline'
    - dufs_bundle_archive_path | length > 0

- name: 安装 dufs systemd 单元
  ansible.builtin.template:
    src: dufs.service.j2
    dest: /etc/systemd/system/dufs.service
    owner: root
    group: root
    mode: "0644"
  notify: 重启 dufs

- name: 启用并启动 dufs
  ansible.builtin.systemd_service:
    name: dufs
    state: started
    enabled: true
    daemon_reload: true

- name: 执行待处理的 dufs Handler
  ansible.builtin.meta: flush_handlers

- name: 确认 dufs 已经监听配置端口
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ dufs_port }}"
    state: started
    timeout: 15

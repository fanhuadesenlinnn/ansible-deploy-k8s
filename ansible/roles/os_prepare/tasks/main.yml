---
# 操作系统准备 Role：让目标主机满足 kubelet 和容器网络的基础要求。
# 在线模式通过 apt 安装基础工具；离线模式只安装 offline_remote_dir/packages 中已有的 deb，禁止补下载。
# 主要输出：Swap 关闭、overlay/br_netfilter 模块持久化、转发和桥接流量 sysctl 生效。

- name: 在在线模式下安装操作系统基础软件包
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - conntrack
      - curl
      - gpg
      - gzip
      - iptables
      - socat
      - tar
    state: present
    update_cache: true
    cache_valid_time: 3600
  environment: "{{ proxy_env }}"
  when: install_mode == 'online'

# 离线包只收集必需依赖，不收集 apt 的 Recommends；显式禁用推荐包可防止 apt 尝试获取包外内容。
# 将离线 packages/ 指定为 apt 归档缓存也很重要：否则即使传入本地 deb 的绝对路径，
# apt 仍可能为软件源中存在的同版本包选择远程 URI，随后被 --no-download 拒绝。
- name: 从离线包安装所有软件包  # noqa command-instead-of-module
  ansible.builtin.shell:
    cmd: >-
      apt-get
      -o {{ ('Dir::Cache::archives=' ~ offline_remote_dir ~ '/packages') | quote }}
      install --yes --no-download --no-install-recommends
      {{ offline_deb_packages.files | map(attribute='path') | map('quote') | join(' ') }}
  args:
    executable: /bin/bash
  environment: "{{ proxy_env }}"
  register: offline_apt_install
  changed_when: "'Setting up' in offline_apt_install.stdout or 'Unpacking' in offline_apt_install.stdout"
  when: install_mode == 'offline'

# kubelet 默认要求关闭 Swap。swapoff 处理当前状态，下面的 fstab 修改保证重启后仍然关闭。
- name: 禁用当前 Swap
  ansible.builtin.command: swapoff -a
  when:
    - kubelet_fail_swap_on | bool
    - ansible_swaptotal_mb | int > 0
  changed_when: true

- name: 禁用 fstab 中的 Swap 条目
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!#)(.*\s+swap\s+.*)$'
    replace: '# disabled by ansible-deploy-k8s: \1'
    backup: true
  when: kubelet_fail_swap_on | bool

# modules-load.d 负责重启后自动加载；modprobe 负责让本次运行立即生效。
- name: 持久化所需的内核模块
  ansible.builtin.template:
    src: kubernetes.conf.j2
    dest: /etc/modules-load.d/kubernetes.conf
    owner: root
    group: root
    mode: "0644"

- name: 加载所需的内核模块
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: 配置 Kubernetes sysctl 参数
  ansible.builtin.template:
    src: 99-kubernetes-cri.conf.j2
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    owner: root
    group: root
    mode: "0644"
  notify: 应用 sysctl 参数

# 在安装容器运行时前立即应用 sysctl，而不是等到整个 Play 结束后再执行 Handler。
- name: 执行待处理的操作系统 Handler
  ansible.builtin.meta: flush_handlers

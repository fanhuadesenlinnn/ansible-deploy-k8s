---
# 配置文件或代理 Drop-In 发生变化时重启对应运行时，并通过 daemon_reload 重新读取 systemd Unit。
- name: 重启 containerd
  ansible.builtin.systemd_service:
    name: containerd
    state: restarted
    daemon_reload: true

- name: 重启 CRI-O
  ansible.builtin.systemd_service:
    name: crio
    state: restarted
    daemon_reload: true

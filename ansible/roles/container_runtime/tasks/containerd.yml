---
# containerd 子任务：安装服务、生成基础配置、启用 systemd cgroup、配置镜像端点并导入离线镜像。
# 在线模式由 apt 安装；离线模式的软件包已由 os_prepare 统一安装，因此这里只验证命令是否存在。

- name: 在在线模式下安装 containerd
  ansible.builtin.apt:
    name: "{{ containerd_package }}"
    state: present
    update_cache: true
  environment: "{{ proxy_env }}"
  when: install_mode == 'online'

- name: 验证 containerd 已安装
  ansible.builtin.command: containerd --version
  register: containerd_version_result
  changed_when: false

- name: 创建 containerd 配置目录
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: 检查现有 containerd 配置
  ansible.builtin.stat:
    path: /etc/containerd/config.toml
  register: containerd_config

# 仅在配置文件不存在时生成默认配置，避免覆盖管理员已有的 containerd 自定义内容。
- name: 生成 containerd 默认配置
  ansible.builtin.command: containerd config default
  register: containerd_default_config
  changed_when: false
  when: not containerd_config.stat.exists

- name: 安装 containerd 默认配置
  ansible.builtin.copy:
    content: "{{ containerd_default_config.stdout }}\n"
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  notify: 重启 containerd
  when: not containerd_config.stat.exists

# kubelet 和 containerd 必须使用一致的 cgroup 驱动；本项目统一采用 Kubernetes 推荐的 systemd。
- name: 在 containerd 中使用 systemd cgroup 驱动
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup\s*=\s*false'
    replace: 'SystemdCgroup = true'
  notify: 重启 containerd

# config_path 让 containerd 从 /etc/containerd/certs.d/<仓库>/hosts.toml 读取逐仓库配置。
- name: 启用 containerd 镜像仓库主机配置
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'config_path\s*=\s*""'
    replace: 'config_path = "/etc/containerd/certs.d"'
  notify: 重启 containerd
  when: registry_mirrors | length > 0

- name: 创建 containerd 镜像仓库配置目录
  ansible.builtin.file:
    path: "/etc/containerd/certs.d/{{ item.key }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ registry_mirrors | dict2items }}"
  when: registry_mirrors | length > 0

- name: 配置 containerd 镜像仓库端点
  ansible.builtin.template:
    src: hosts.toml.j2
    dest: "/etc/containerd/certs.d/{{ item.key }}/hosts.toml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ registry_mirrors | dict2items }}"
  notify: 重启 containerd
  when: registry_mirrors | length > 0

- name: 启用并启动 containerd
  ansible.builtin.service:
    name: containerd
    state: started
    enabled: true

# 配置变更后先重启 containerd，再继续导入镜像或运行 crictl 连通性检查。
- name: 执行待处理的 containerd Handler
  ansible.builtin.meta: flush_handlers

- name: 查找离线容器镜像
  ansible.builtin.find:
    paths: "{{ offline_remote_dir }}/images"
    patterns: "*.tar"
    file_type: file
  register: offline_image_archives
  when: install_mode == 'offline'

# Kubernetes 通过 CRI 使用 containerd 的 k8s.io namespace，因此离线镜像必须导入该 namespace。
- name: 将离线镜像导入 containerd
  ansible.builtin.command:
    argv:
      - ctr
      - --namespace
      - k8s.io
      - images
      - import
      - "{{ item.path }}"
  loop: "{{ offline_image_archives.files | default([]) }}"
  register: containerd_image_import
  changed_when: "'unpacking' in containerd_image_import.stdout or 'done' in containerd_image_import.stdout"

- name: 读取 containerd 已导入的镜像引用
  ansible.builtin.command:
    argv:
      - ctr
      - --namespace
      - k8s.io
      - images
      - list
      - --quiet
  register: containerd_imported_images
  changed_when: false
  when: install_mode == 'offline'

- name: 确认 containerd 包含离线包声明的全部镜像
  ansible.builtin.assert:
    that:
      - >-
        offline_bundle_metadata.images
        | difference(containerd_imported_images.stdout_lines | default([]))
        | length == 0
    fail_msg: 离线镜像导入不完整，请检查前面的 ctr import 输出。
    success_msg: containerd 已包含离线包声明的全部镜像。
  when: install_mode == 'offline'

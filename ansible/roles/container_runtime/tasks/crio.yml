---
# CRI-O 子任务：在线模式配置官方软件源并安装服务；离线模式复用 os_prepare 安装的软件包。
# 离线镜像通过 podman load 导入 CRI-O 使用的本地容器存储，因此离线包必须包含 podman 及其依赖。

- name: 创建 CRI-O apt 密钥环目录
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: install_mode == 'online'

- name: 下载 CRI-O 软件源密钥
  ansible.builtin.get_url:
    url: "{{ crio_apt_key_url }}"
    dest: /etc/apt/keyrings/cri-o.asc
    owner: root
    group: root
    mode: "0644"
  environment: "{{ proxy_env }}"
  when: install_mode == 'online'

- name: 配置 CRI-O 软件源
  ansible.builtin.apt_repository:
    repo: "{{ crio_apt_repository }}"
    filename: cri-o
    state: present
    update_cache: true
  environment: "{{ proxy_env }}"
  when: install_mode == 'online'

- name: 在在线模式下安装 CRI-O
  ansible.builtin.apt:
    name: cri-o
    state: present
    update_cache: true
  environment: "{{ proxy_env }}"
  when: install_mode == 'online'

- name: 验证 CRI-O 已安装
  ansible.builtin.command: crio --version
  register: crio_version_result
  changed_when: false

- name: 启用并启动 CRI-O
  ansible.builtin.service:
    name: crio
    state: started
    enabled: true

- name: 查找离线 CRI-O 镜像
  ansible.builtin.find:
    paths: "{{ offline_remote_dir }}/images"
    patterns: "*.tar"
    file_type: file
  register: offline_crio_image_archives
  when: install_mode == 'offline'

# 仅在确实发现镜像归档时要求 podman，允许不需要预载镜像的特殊离线包跳过此检查。
- name: 验证 podman 可用于导入离线 CRI-O 镜像
  ansible.builtin.command: podman --version
  changed_when: false
  when:
    - install_mode == 'offline'
    - offline_crio_image_archives.matched | default(0) | int > 0

# 先按元数据中的原始镜像引用检查本地存储，只导入缺失项。这样重复执行部署时
# 不会反复解包全部镜像，也能让 Ansible 的 changed 结果准确反映实际变化。
- name: 检查 CRI-O 存储中的离线镜像
  ansible.builtin.command:
    argv:
      - podman
      - image
      - exists
      - "{{ item }}"
  loop: "{{ offline_bundle_metadata.images }}"
  register: crio_image_presence
  changed_when: false
  failed_when: crio_image_presence.rc not in [0, 1]
  when: install_mode == 'offline'

- name: 为 CRI-O 导入缺失的离线镜像
  ansible.builtin.command:
    argv:
      - podman
      - load
      - --input
      - >-
        {{ offline_remote_dir }}/images/{{ item.item
        | regex_replace('[^A-Za-z0-9._-]', '_') }}.tar
  loop: "{{ crio_image_presence.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true
  when:
    - install_mode == 'offline'
    - item.rc | int == 1

- name: 确认 CRI-O 存储包含离线包声明的全部镜像
  ansible.builtin.command:
    argv:
      - podman
      - image
      - exists
      - "{{ item }}"
  loop: "{{ offline_bundle_metadata.images }}"
  changed_when: false
  when: install_mode == 'offline'

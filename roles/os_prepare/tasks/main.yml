---
- name: 在在线模式下安装操作系统基础软件包
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - conntrack
      - curl
      - gpg
      - gzip
      - iptables
      - socat
      - tar
    state: present
    update_cache: true
    cache_valid_time: 3600
  environment: "{{ proxy_env }}"
  when: install_mode == 'online'

- name: 从离线包安装所有软件包  # noqa command-instead-of-module
  ansible.builtin.shell:
    cmd: >-
      apt-get install -y --no-download
      {{ offline_deb_packages.files | map(attribute='path') | map('quote') | join(' ') }}
  args:
    executable: /bin/bash
  environment: "{{ proxy_env }}"
  register: offline_apt_install
  changed_when: "'Setting up' in offline_apt_install.stdout or 'Unpacking' in offline_apt_install.stdout"
  when: install_mode == 'offline'

- name: 禁用当前 Swap
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: true

- name: 禁用 fstab 中的 Swap 条目
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!#)(.*\s+swap\s+.*)$'
    replace: '# disabled by ansible-deploy-k8s: \1'
    backup: true

- name: 持久化所需的内核模块
  ansible.builtin.template:
    src: kubernetes.conf.j2
    dest: /etc/modules-load.d/kubernetes.conf
    owner: root
    group: root
    mode: "0644"

- name: 加载所需的内核模块
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: 配置 Kubernetes sysctl 参数
  ansible.builtin.template:
    src: 99-kubernetes-cri.conf.j2
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    owner: root
    group: root
    mode: "0644"
  notify: 应用 sysctl 参数

- name: 执行待处理的操作系统 Handler
  ansible.builtin.meta: flush_handlers

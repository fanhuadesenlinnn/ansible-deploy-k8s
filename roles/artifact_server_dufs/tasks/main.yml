---
- name: Map host architecture to dufs release architecture
  ansible.builtin.set_fact:
    dufs_arch: "{{ {'x86_64': 'x86_64', 'aarch64': 'aarch64'}[ansible_architecture] }}"

- name: Require a checksum for online dufs downloads
  ansible.builtin.assert:
    that:
      - dufs_checksum | length > 0
    fail_msg: Set dufs_checksum to the SHA-256 digest of dufs_download_url.
  when: install_mode == 'online'

- name: Ensure the artifact root exists
  ansible.builtin.file:
    path: "{{ dufs_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download dufs archive in online mode
  ansible.builtin.get_url:
    url: "{{ dufs_download_url }}"
    dest: "/tmp/dufs-{{ dufs_version }}.tar.gz"
    checksum: "{{ dufs_checksum | default(omit, true) }}"
    owner: root
    group: root
    mode: "0644"
  environment: "{{ proxy_env }}"
  when: install_mode == 'online'

- name: Extract dufs in online mode
  ansible.builtin.unarchive:
    src: "/tmp/dufs-{{ dufs_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include:
      - dufs
    owner: root
    group: root
    mode: "0755"
  when: install_mode == 'online'

- name: Install dufs from the offline bundle
  ansible.builtin.copy:
    src: "{{ offline_remote_dir }}/bin/dufs"
    dest: /usr/local/bin/dufs
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: install_mode == 'offline'

- name: Install dufs systemd unit
  ansible.builtin.template:
    src: dufs.service.j2
    dest: /etc/systemd/system/dufs.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart dufs

- name: Enable and start dufs
  ansible.builtin.systemd_service:
    name: dufs
    state: started
    enabled: true
    daemon_reload: true

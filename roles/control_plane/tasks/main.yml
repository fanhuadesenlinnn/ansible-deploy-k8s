---
- name: Identify the primary control-plane host
  ansible.builtin.set_fact:
    kubernetes_primary_control_plane: "{{ groups['kube_control_plane'][0] }}"
    kubernetes_is_primary_control_plane: "{{ inventory_hostname == groups['kube_control_plane'][0] }}"

- name: Initialize the primary control plane
  ansible.builtin.include_tasks: init.yml
  when: kubernetes_is_primary_control_plane | bool

- name: Join an additional control-plane node
  ansible.builtin.include_tasks: join.yml
  when: not kubernetes_is_primary_control_plane | bool

---
# Kubernetes 软件包 Role：在线模式配置官方 apt 源，然后安装指定版本的 kubeadm、kubelet 和 kubectl。
# 离线模式的软件包已由 os_prepare 安装，本 Role 仍会验证命令并锁定版本，防止 apt 自动升级节点。

- name: 创建 Kubernetes apt 密钥环目录
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: install_mode == 'online'

- name: 下载 Kubernetes 软件源密钥
  ansible.builtin.get_url:
    url: "{{ kubernetes_apt_key_url }}"
    dest: /etc/apt/keyrings/kubernetes.asc
    owner: root
    group: root
    mode: "0644"
  environment: "{{ proxy_env }}"
  when: install_mode == 'online'

- name: 配置 Kubernetes 软件源
  ansible.builtin.apt_repository:
    repo: "{{ kubernetes_apt_repository }}"
    filename: kubernetes
    state: present
    update_cache: true
  environment: "{{ proxy_env }}"
  when: install_mode == 'online'

- name: 安装固定版本的 Kubernetes 软件包
  ansible.builtin.apt:
    name:
      - "kubeadm={{ kubernetes_package_version }}"
      - "kubectl={{ kubernetes_package_version }}"
      - "kubelet={{ kubernetes_package_version }}"
    state: present
    update_cache: true
    allow_downgrade: false
  environment: "{{ proxy_env }}"
  when: install_mode == 'online'

# command 循环既确认文件存在，也能尽早发现离线包版本或依赖不完整。
- name: 验证 Kubernetes 命令已安装
  ansible.builtin.command: "{{ item }}"
  loop:
    - kubeadm version -o short
    - kubelet --version
    - kubectl version --client
  changed_when: false

# kubeadm 升级要求严格的版本顺序，因此使用 apt-mark hold 禁止普通系统更新顺带升级这些组件。
- name: 锁定 Kubernetes 软件包版本
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubeadm
    - kubectl
    - kubelet

- name: 启用 kubelet
  ansible.builtin.service:
    name: kubelet
    enabled: true

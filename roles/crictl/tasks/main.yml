---
- name: 将主机架构映射为 crictl 发布架构
  ansible.builtin.set_fact:
    crictl_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}"

- name: 验证在线 crictl 发布包参数
  ansible.builtin.assert:
    that:
      - crictl_download_url | length > 0
      - crictl_checksum | length > 0
    fail_msg: 请为所选版本和架构设置 crictl_download_url 与 crictl_checksum。
    success_msg: crictl 在线发布包参数有效。
  when: install_mode == 'online'

- name: 创建 crictl 安装目录
  ansible.builtin.file:
    path: "{{ crictl_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: 创建 crictl 配置目录
  ansible.builtin.file:
    path: "{{ crictl_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: 检查已安装的 crictl 版本
  ansible.builtin.command:
    argv:
      - "{{ crictl_install_path }}"
      - --version
  register: crictl_installed_version
  changed_when: false
  failed_when: false

- name: 判断是否需要安装 crictl
  ansible.builtin.set_fact:
    crictl_needs_install: >-
      {{ crictl_installed_version.rc != 0 or
         crictl_version not in (crictl_installed_version.stdout | default('')) }}

- name: 下载 crictl 发布归档
  ansible.builtin.get_url:
    url: "{{ crictl_download_url }}"
    dest: "/tmp/crictl-{{ crictl_version }}-linux-{{ crictl_arch }}.tar.gz"
    checksum: "{{ crictl_checksum }}"
    owner: root
    group: root
    mode: "0644"
  environment: "{{ proxy_env }}"
  when:
    - install_mode == 'online'
    - crictl_needs_install | bool

- name: 从在线发布归档安装 crictl
  ansible.builtin.unarchive:
    src: "/tmp/crictl-{{ crictl_version }}-linux-{{ crictl_arch }}.tar.gz"
    dest: "{{ crictl_install_dir }}"
    remote_src: true
    include:
      - crictl
    owner: root
    group: root
    mode: "0755"
  when:
    - install_mode == 'online'
    - crictl_needs_install | bool

- name: 从离线包安装 crictl
  ansible.builtin.copy:
    src: "{{ offline_remote_dir }}/bin/crictl"
    dest: "{{ crictl_install_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: install_mode == 'offline'

- name: 为所选容器运行时配置 crictl
  ansible.builtin.template:
    src: crictl.yaml.j2
    dest: "{{ crictl_config_path }}"
    owner: root
    group: root
    mode: "0644"

- name: 读取已安装的 crictl 版本
  ansible.builtin.command:
    argv:
      - "{{ crictl_install_path }}"
      - --version
  register: crictl_version_result
  changed_when: false

- name: 验证已安装指定的 crictl 版本
  ansible.builtin.assert:
    that:
      - crictl_version in crictl_version_result.stdout
    fail_msg: >-
      已安装的 crictl 与 crictl_version={{ crictl_version }} 不一致。
    success_msg: 已安装指定版本的 crictl。

- name: 验证 crictl 可以连接容器运行时
  ansible.builtin.command:
    argv:
      - "{{ crictl_install_path }}"
      - "--config={{ crictl_config_path }}"
      - info
  register: crictl_runtime_info
  changed_when: false
  retries: 5
  delay: 2
  until: crictl_runtime_info.rc == 0

---
- name: 创建 CRI-O apt 密钥环目录
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: install_mode == 'online'

- name: 下载 CRI-O 软件源密钥
  ansible.builtin.get_url:
    url: "{{ crio_apt_key_url }}"
    dest: /etc/apt/keyrings/cri-o.asc
    owner: root
    group: root
    mode: "0644"
  environment: "{{ proxy_env }}"
  when: install_mode == 'online'

- name: 配置 CRI-O 软件源
  ansible.builtin.apt_repository:
    repo: "{{ crio_apt_repository }}"
    filename: cri-o
    state: present
    update_cache: true
  environment: "{{ proxy_env }}"
  when: install_mode == 'online'

- name: 在在线模式下安装 CRI-O
  ansible.builtin.apt:
    name: cri-o
    state: present
    update_cache: true
  environment: "{{ proxy_env }}"
  when: install_mode == 'online'

- name: 验证 CRI-O 已安装
  ansible.builtin.command: crio --version
  register: crio_version_result
  changed_when: false

- name: 启用并启动 CRI-O
  ansible.builtin.service:
    name: crio
    state: started
    enabled: true

- name: 查找离线 CRI-O 镜像
  ansible.builtin.find:
    paths: "{{ offline_remote_dir }}/images"
    patterns: "*.tar"
    file_type: file
  register: offline_crio_image_archives
  when: install_mode == 'offline'

- name: 验证 podman 可用于导入离线 CRI-O 镜像
  ansible.builtin.command: podman --version
  changed_when: false
  when:
    - install_mode == 'offline'
    - offline_crio_image_archives.matched | default(0) | int > 0

- name: 为 CRI-O 导入离线镜像
  ansible.builtin.command:
    argv:
      - podman
      - load
      - --input
      - "{{ item.path }}"
  loop: "{{ offline_crio_image_archives.files | default([]) }}"
  register: crio_image_import
  changed_when: "'Loaded image' in crio_image_import.stdout"

---
- name: Validate supported operating system family
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
      - ansible_service_mgr == 'systemd'
    fail_msg: This release supports Debian/Ubuntu hosts using systemd and apt.

- name: Validate supported CPU architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['x86_64', 'aarch64']
    fail_msg: "Unsupported architecture: {{ ansible_architecture }}"

- name: Validate installation variables
  ansible.builtin.assert:
    that:
      - container_runtime in ['containerd', 'crio']
      - install_mode in ['online', 'offline']
      - kubernetes_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - kubernetes_version_minor is match('^v[0-9]+\.[0-9]+$')
      - pod_network_cidr != service_cidr
    fail_msg: Review the version, runtime, install mode, and cluster CIDR variables.

- name: Require a stable endpoint for a highly available control plane
  ansible.builtin.assert:
    that:
      - control_plane_endpoint | length > 0
    fail_msg: Multiple control-plane nodes require control_plane_endpoint to reference a load balancer or VIP.
  when: groups['kube_control_plane'] | length > 1

- name: Check minimum control-plane memory
  ansible.builtin.assert:
    that:
      - ansible_memtotal_mb >= 1700
    fail_msg: A control-plane node requires approximately 2 GiB of memory or more.
  when: inventory_hostname in groups['kube_control_plane']

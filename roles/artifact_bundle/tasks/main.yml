---
# 离线资源准备 Role：仅在 install_mode=offline 时执行实际工作。
# 支持两种来源：从 Ansible 控制端复制目录，或由每台目标主机下载同一个 HTTP tar.gz 归档。
# 最终输出统一位于 offline_remote_dir，后续 Role 不需要关心资源采用哪种传输方式。

# path 与 url 必须二选一；HTTP 内容还必须使用校验和固定，避免节点下载到不同版本。
- name: 验证离线包来源
  ansible.builtin.assert:
    that:
      - (offline_bundle_path | length > 0) != (offline_bundle_url | length > 0)
      - >-
        offline_bundle_url | length == 0 or
        offline_bundle_checksum | default('') | length > 0
    fail_msg: >-
      离线模式下必须且只能设置 offline_bundle_path 或 offline_bundle_url 其中之一；
      使用 HTTP 归档时还必须设置 offline_bundle_checksum。
    success_msg: 离线包来源参数有效。
  when: install_mode == 'offline'

- name: 创建离线包目录
  ansible.builtin.file:
    path: "{{ offline_remote_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: install_mode == 'offline'

- name: 从 Ansible 控制端复制离线包
  ansible.builtin.copy:
    src: "{{ offline_bundle_path }}/"
    dest: "{{ offline_remote_dir }}/"
    owner: root
    group: root
    mode: preserve
  when:
    - install_mode == 'offline'
    - offline_bundle_path | length > 0

- name: 下载离线包归档
  ansible.builtin.get_url:
    url: "{{ offline_bundle_url }}"
    dest: /tmp/ansible-install-k8s-offline-bundle.tar.gz
    checksum: "{{ offline_bundle_checksum | default(omit, true) }}"
    owner: root
    group: root
    mode: "0644"
  environment: "{{ proxy_env }}"
  register: offline_bundle_download
  when:
    - install_mode == 'offline'
    - offline_bundle_url | length > 0

# 只有下载内容发生变化时才清空子目录，防止新旧归档文件混合后通过完整性检查。
- name: 在解压已变更的归档前删除旧内容
  ansible.builtin.file:
    path: "{{ offline_remote_dir }}/{{ item }}"
    state: absent
  loop:
    - packages
    - images
    - manifests
    - bin
  when:
    - install_mode == 'offline'
    - offline_bundle_url | length > 0
    - offline_bundle_download.changed

- name: 解压离线包归档
  ansible.builtin.unarchive:
    src: /tmp/ansible-install-k8s-offline-bundle.tar.gz
    dest: "{{ offline_remote_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
  when:
    - install_mode == 'offline'
    - offline_bundle_url | length > 0

- name: 检查离线 Debian 软件包
  ansible.builtin.find:
    paths: "{{ offline_remote_dir }}/packages"
    patterns: "*.deb"
    file_type: file
  register: offline_deb_packages
  when: install_mode == 'offline'

- name: 检查离线容器镜像
  ansible.builtin.find:
    paths: "{{ offline_remote_dir }}/images"
    patterns: "*.tar"
    file_type: file
  register: offline_bundle_images
  when: install_mode == 'offline'

- name: 检查离线 CNI 清单
  ansible.builtin.stat:
    path: "{{ offline_remote_dir }}/manifests/{{ offline_cni_manifest }}"
  register: offline_bundle_cni_manifest
  when: install_mode == 'offline'

- name: 检查离线 crictl 二进制文件
  ansible.builtin.stat:
    path: "{{ offline_remote_dir }}/bin/crictl"
  register: offline_bundle_crictl
  when:
    - install_mode == 'offline'
    - install_crictl | bool

# 在任何 apt 安装或镜像导入前一次性检查关键文件，使缺失资源尽早失败。
- name: 确认离线包内容完整
  ansible.builtin.assert:
    that:
      - offline_deb_packages.matched | int > 0
      - >-
        offline_deb_packages.files
        | map(attribute='path')
        | map('basename')
        | select('match', '^kubeadm_.*\.deb$')
        | list
        | length > 0
      - >-
        offline_deb_packages.files
        | map(attribute='path')
        | map('basename')
        | select('match', '^kubelet_.*\.deb$')
        | list
        | length > 0
      - >-
        offline_deb_packages.files
        | map(attribute='path')
        | map('basename')
        | select('match', '^kubectl_.*\.deb$')
        | list
        | length > 0
      - >-
        offline_deb_packages.files
        | map(attribute='path')
        | map('basename')
        | select('match', '^' ~ (containerd_package if container_runtime == 'containerd' else 'cri-o') ~ '_.*\.deb$')
        | list
        | length > 0
      - offline_bundle_images.matched | int > 0
      - offline_bundle_cni_manifest.stat.exists
      - offline_bundle_cni_manifest.stat.isreg
      - >-
        not (install_crictl | bool) or
        (offline_bundle_crictl.stat.exists | default(false) and
        offline_bundle_crictl.stat.isreg | default(false))
    fail_msg: >-
      离线包必须在 packages/ 中包含 kubeadm、kubelet、kubectl、所选容器运行时
      及其全部依赖，至少包含一个 images/*.tar、manifests/ 下配置的 CNI 清单；
      启用 crictl 时还必须包含 bin/crictl。
    success_msg: 离线包内容完整。
  when: install_mode == 'offline'

---
- name: Validate offline bundle source
  ansible.builtin.assert:
    that:
      - (offline_bundle_path | length > 0) != (offline_bundle_url | length > 0)
      - >-
        offline_bundle_url | length == 0 or
        offline_bundle_checksum | default('') | length > 0
    fail_msg: >-
      Set exactly one of offline_bundle_path or offline_bundle_url in offline
      mode, and provide offline_bundle_checksum for an HTTP archive.
  when: install_mode == 'offline'

- name: Create offline bundle directory
  ansible.builtin.file:
    path: "{{ offline_remote_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: install_mode == 'offline'

- name: Copy offline bundle from the Ansible controller
  ansible.builtin.copy:
    src: "{{ offline_bundle_path }}/"
    dest: "{{ offline_remote_dir }}/"
    owner: root
    group: root
    mode: preserve
  when:
    - install_mode == 'offline'
    - offline_bundle_path | length > 0

- name: Download offline bundle archive
  ansible.builtin.get_url:
    url: "{{ offline_bundle_url }}"
    dest: /tmp/ansible-install-k8s-offline-bundle.tar.gz
    checksum: "{{ offline_bundle_checksum | default(omit, true) }}"
    owner: root
    group: root
    mode: "0644"
  environment: "{{ proxy_env }}"
  register: offline_bundle_download
  when:
    - install_mode == 'offline'
    - offline_bundle_url | length > 0

- name: Remove stale content before extracting a changed archive
  ansible.builtin.file:
    path: "{{ offline_remote_dir }}/{{ item }}"
    state: absent
  loop:
    - packages
    - images
    - manifests
    - bin
  when:
    - install_mode == 'offline'
    - offline_bundle_url | length > 0
    - offline_bundle_download.changed

- name: Extract offline bundle archive
  ansible.builtin.unarchive:
    src: /tmp/ansible-install-k8s-offline-bundle.tar.gz
    dest: "{{ offline_remote_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
  when:
    - install_mode == 'offline'
    - offline_bundle_url | length > 0

- name: Inspect offline Debian packages
  ansible.builtin.find:
    paths: "{{ offline_remote_dir }}/packages"
    patterns: "*.deb"
    file_type: file
  register: offline_deb_packages
  when: install_mode == 'offline'

- name: Inspect offline container images
  ansible.builtin.find:
    paths: "{{ offline_remote_dir }}/images"
    patterns: "*.tar"
    file_type: file
  register: offline_bundle_images
  when: install_mode == 'offline'

- name: Inspect the offline CNI manifest
  ansible.builtin.stat:
    path: "{{ offline_remote_dir }}/manifests/{{ offline_cni_manifest }}"
  register: offline_bundle_cni_manifest
  when: install_mode == 'offline'

- name: Require a complete offline bundle
  ansible.builtin.assert:
    that:
      - offline_deb_packages.matched | int > 0
      - >-
        offline_deb_packages.files
        | map(attribute='path')
        | map('basename')
        | select('match', '^kubeadm_.*\.deb$')
        | list
        | length > 0
      - >-
        offline_deb_packages.files
        | map(attribute='path')
        | map('basename')
        | select('match', '^kubelet_.*\.deb$')
        | list
        | length > 0
      - >-
        offline_deb_packages.files
        | map(attribute='path')
        | map('basename')
        | select('match', '^kubectl_.*\.deb$')
        | list
        | length > 0
      - >-
        offline_deb_packages.files
        | map(attribute='path')
        | map('basename')
        | select('match', '^' ~ (containerd_package if container_runtime == 'containerd' else 'cri-o') ~ '_.*\.deb$')
        | list
        | length > 0
      - offline_bundle_images.matched | int > 0
      - offline_bundle_cni_manifest.stat.exists
      - offline_bundle_cni_manifest.stat.isreg
    fail_msg: >-
      The offline bundle must include kubeadm, kubelet, kubectl, the selected
      runtime and all dependencies under packages/, at least one images/*.tar,
      and the configured CNI manifest under manifests/.
  when: install_mode == 'offline'

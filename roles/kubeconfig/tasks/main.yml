---
- name: 创建本地 kubeconfig 输出目录
  ansible.builtin.file:
    path: "{{ kubeconfig_output_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: 获取管理员 kubeconfig
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubeconfig_output_file }}"
    flat: true

- name: 限制本地 kubeconfig 权限
  ansible.builtin.file:
    path: "{{ kubeconfig_output_file }}"
    mode: "0600"
  delegate_to: localhost
  become: false

- name: 按需替换已导出的 API Server 地址
  ansible.builtin.replace:
    path: "{{ kubeconfig_output_file }}"
    regexp: '^\s*server:\s+.*$'
    replace: "    server: {{ kubeconfig_server }}"
  delegate_to: localhost
  become: false
  when: kubeconfig_server | length > 0

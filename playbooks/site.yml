---
- name: 验证 Inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: 确认至少定义了一台控制平面主机
      ansible.builtin.assert:
        that:
          - groups['kube_control_plane'] | default([]) | length > 0
          - groups['k8s_cluster'] | default([]) | length > 0
          - >-
            groups['kube_control_plane']
            | difference(groups['k8s_cluster'] | default([]))
            | length == 0
          - >-
            groups['kube_workers'] | default([])
            | difference(groups['k8s_cluster'] | default([]))
            | length == 0
        fail_msg: >-
          Inventory 必须定义 kube_control_plane 和 k8s_cluster，且每台控制平面主机和
          工作节点都必须同时属于 k8s_cluster。
        success_msg: Inventory 结构验证通过。

    - name: 验证集群网络 CIDR
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - >-
            import ipaddress, sys;
            pod = ipaddress.ip_network(sys.argv[1]);
            service = ipaddress.ip_network(sys.argv[2]);
            sys.exit('pod_network_cidr 与 service_cidr 不能重叠'
            if pod.overlaps(service) else 0)
          - "{{ pod_network_cidr }}"
          - "{{ service_cidr }}"
      changed_when: false
      check_mode: false
      become: false

- name: 准备 Kubernetes 主机
  hosts: k8s_cluster
  become: true
  gather_facts: true
  roles:
    - preflight
    - artifact_bundle
    - os_prepare
    - container_runtime
    - role: crictl
      when: install_crictl | bool
    - kubernetes_packages

- name: 初始化或扩展控制平面
  hosts: kube_control_plane
  become: true
  gather_facts: true
  serial: 1
  roles:
    - control_plane

- name: 安装集群网络
  hosts: "kube_control_plane[0]"
  become: true
  gather_facts: false
  roles:
    - cni

- name: 加入工作节点
  hosts: kube_workers
  become: true
  gather_facts: true
  roles:
    - worker

- name: 导出管理员 kubeconfig
  hosts: "kube_control_plane[0]"
  become: true
  gather_facts: false
  roles:
    - kubeconfig

- name: 验证所有已注册节点进入就绪状态
  hosts: "kube_control_plane[0]"
  become: true
  gather_facts: false
  tasks:
    - name: 等待所有节点报告 Ready 状态
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - wait
          - --for=condition=Ready
          - nodes
          - --all
          - --timeout=300s
      register: kubernetes_nodes_ready
      changed_when: false

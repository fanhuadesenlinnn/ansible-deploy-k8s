---
- name: Validate inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require at least one control-plane host
      ansible.builtin.assert:
        that:
          - groups['kube_control_plane'] | default([]) | length > 0
          - groups['k8s_cluster'] | default([]) | length > 0
          - >-
            groups['kube_control_plane']
            | difference(groups['k8s_cluster'] | default([]))
            | length == 0
          - >-
            groups['kube_workers'] | default([])
            | difference(groups['k8s_cluster'] | default([]))
            | length == 0
        fail_msg: >-
          Inventory must define kube_control_plane and k8s_cluster, and every
          control-plane and worker host must also belong to k8s_cluster.

    - name: Validate cluster network CIDRs
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - >-
            import ipaddress, sys;
            pod = ipaddress.ip_network(sys.argv[1]);
            service = ipaddress.ip_network(sys.argv[2]);
            sys.exit('pod_network_cidr and service_cidr must not overlap'
            if pod.overlaps(service) else 0)
          - "{{ pod_network_cidr }}"
          - "{{ service_cidr }}"
      changed_when: false
      check_mode: false
      become: false

- name: Prepare Kubernetes hosts
  hosts: k8s_cluster
  become: true
  gather_facts: true
  roles:
    - preflight
    - artifact_bundle
    - os_prepare
    - container_runtime
    - role: crictl
      when: install_crictl | bool
    - kubernetes_packages

- name: Initialize or extend the control plane
  hosts: kube_control_plane
  become: true
  gather_facts: true
  serial: 1
  roles:
    - control_plane

- name: Install the cluster network
  hosts: "kube_control_plane[0]"
  become: true
  gather_facts: false
  roles:
    - cni

- name: Join worker nodes
  hosts: kube_workers
  become: true
  gather_facts: true
  roles:
    - worker

- name: Export administrator kubeconfig
  hosts: "kube_control_plane[0]"
  become: true
  gather_facts: false
  roles:
    - kubeconfig

- name: Verify all registered nodes become ready
  hosts: "kube_control_plane[0]"
  become: true
  gather_facts: false
  tasks:
    - name: Wait for every node to report Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - wait
          - --for=condition=Ready
          - nodes
          - --all
          - --timeout=300s
      register: kubernetes_nodes_ready
      changed_when: false

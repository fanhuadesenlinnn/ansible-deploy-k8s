---
# Dependabot 每周检查 GitHub Actions 和 Python 依赖更新，并以 PR 形式提交建议。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # ansible-core 2.20+ 要求控制端 Python 3.12+；项目目前仍承诺支持 Python 3.10。
    # 提升 Python 最低版本时，应同步移除此规则并重新验证 Playbook。
    ignore:
      - dependency-name: ansible-core
        versions:
          - ">=2.20"

---
# Dependabot 每周检查 GitHub Actions 和 Python 依赖更新，并以 PR 形式提交建议。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /ansible
    schedule:
      interval: weekly
    # ansible-core 的宽版本范围用于按控制端 Python 版本选择最新兼容版本：
    # Python 3.10 会安装 2.17.x，Python 3.12 会安装 2.19.x。Dependabot 若抬高
    # 最低版本会破坏该兼容策略；提升项目最低 Python 版本时再移除此规则并重新验证。
    ignore:
      - dependency-name: ansible-core

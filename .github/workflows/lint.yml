---
# 所有 PR 和推送到 main 的提交都会运行本工作流，确保文档/注释调整也不会破坏 YAML 或 Playbook。
name: 代码检查

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ansible:
    name: Ansible 检查（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 同时覆盖 README 声明的最低版本和容器化控制端使用的 Python 版本。
        python-version: ["3.10", "3.12"]
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ansible/requirements-dev.txt
      - name: 安装开发依赖
        run: pip install -r ansible/requirements-dev.txt
      - name: 安装 Ansible Collection
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: 检查 YAML 格式
        run: yamllint .
      - name: 检查 Ansible 内容
        working-directory: ansible
        run: ansible-lint
      - name: 检查敏感信息
        run: bash scripts/check-no-private-data.sh
      - name: 检查集群安装 Playbook 语法
        working-directory: ansible
        run: ansible-playbook -i inventories/example/hosts.yml playbooks/site.yml --syntax-check
      - name: 检查附加组件 Playbook 语法
        working-directory: ansible
        run: ansible-playbook -i inventories/example/hosts.yml playbooks/addons.yml --syntax-check
      - name: 检查集群重置 Playbook 语法
        working-directory: ansible
        run: ansible-playbook -i inventories/example/hosts.yml playbooks/reset.yml --syntax-check
      - name: 检查制品服务器 Playbook 语法
        working-directory: ansible
        run: ansible-playbook -i inventories/example/hosts.yml playbooks/artifact-server.yml --syntax-check
      - name: 检查 Shell 脚本语法
        run: bash -n ops.sh ansible/commands.sh docker/entrypoint.sh docker/run.sh offline/*.sh
      - name: 检查 Docker Compose 配置
        run: docker compose -f docker/compose.yml config --quiet
      - name: 构建容器化 Ansible 控制端
        if: matrix.python-version == '3.12'
        run: docker compose -f docker/compose.yml build ansible
      - name: 验证容器内 Ansible 环境
        if: matrix.python-version == '3.12'
        run: docker compose -f docker/compose.yml run --rm -T ansible ansible --version

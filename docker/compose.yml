---
# Compose 只提供 Ansible 控制端运行环境，不启动 Kubernetes 节点或 Docker-in-Docker。
name: ansible-deploy-k8s

services:
  ansible:
    build:
      # 构建上下文必须是仓库根目录，Dockerfile 才能读取项目现有的 requirements 文件。
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true

    # 容器只需要访问当前项目；部署产物会通过同一个挂载保留在宿主机 artifacts/ 中。
    volumes:
      - type: bind
        source: ..
        target: /workspace

    environment:
      ANSIBLE_CONFIG: /workspace/ansible.cfg
      ANSIBLE_COLLECTIONS_PATH: /usr/share/ansible/collections
      ANSIBLE_HOME: /tmp/ansible-runtime/home
      ANSIBLE_LOCAL_TEMP: /tmp/ansible-runtime/tmp

    # 控制端不需要特权、Linux Capability 或 Docker Socket。
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
